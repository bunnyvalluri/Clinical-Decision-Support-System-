# =============================================================================
# HealthNova AI — GitLab CI: Container Build & Registry Pipeline
# =============================================================================

.docker_base:
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - |
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      else
        echo "No registry credentials provided; building container in dry/local verification mode."
      fi

docker:build-backend:
  stage: docker
  extends: .docker_base
  script:
    - IMAGE_TAG="${CI_REGISTRY_IMAGE:-healthnova-backend}:${CI_COMMIT_SHA:-local}"
    - docker build -t "$IMAGE_TAG" -f Dockerfile .
    - |
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push "$IMAGE_TAG"
        if [ "$CI_COMMIT_BRANCH" == "main" ]; then
          docker tag "$IMAGE_TAG" "${CI_REGISTRY_IMAGE:-healthnova-backend}:latest"
          docker push "${CI_REGISTRY_IMAGE:-healthnova-backend}:latest"
        fi
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

docker:build-frontend:
  stage: docker
  extends: .docker_base
  script:
    - IMAGE_TAG="${CI_REGISTRY_IMAGE:-healthnova-frontend}:${CI_COMMIT_SHA:-local}"
    - docker build -t "$IMAGE_TAG" -f infrastructure/docker/frontend/Dockerfile .
    - |
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push "$IMAGE_TAG"
        if [ "$CI_COMMIT_BRANCH" == "main" ]; then
          docker tag "$IMAGE_TAG" "${CI_REGISTRY_IMAGE:-healthnova-frontend}:latest"
          docker push "${CI_REGISTRY_IMAGE:-healthnova-frontend}:latest"
        fi
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

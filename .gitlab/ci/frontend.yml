# =============================================================================
# HealthNova AI — GitLab CI: Frontend Pipeline
# =============================================================================

.frontend_base:
  image: node:20-alpine
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  before_script:
    - cd frontend
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
      - frontend/node_modules/
    policy: pull

frontend:install:
  stage: install
  extends: .frontend_base
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
      - frontend/node_modules/
    policy: pull-push
  script:
    - npm ci --cache .npm --prefer-offline
  rules:
    - changes:
        - frontend/**/*
        - .gitlab/ci/frontend.yml
        - .gitlab-ci.yml

frontend:lint:
  stage: lint
  extends: .frontend_base
  script:
    - npm run lint
  rules:
    - changes:
        - frontend/**/*
        - .gitlab/ci/frontend.yml
        - .gitlab-ci.yml

frontend:typecheck:
  stage: typecheck
  extends: .frontend_base
  script:
    - npx tsc --noEmit
  rules:
    - changes:
        - frontend/**/*
        - .gitlab/ci/frontend.yml
        - .gitlab-ci.yml

frontend:test:
  stage: test
  extends: .frontend_base
  script:
    - npm test
  artifacts:
    when: always
    reports:
      junit: frontend/junit.xml
    expire_in: 14 days
  rules:
    - changes:
        - frontend/**/*
        - .gitlab/ci/frontend.yml
        - .gitlab-ci.yml

frontend:build:
  stage: build
  extends: .frontend_base
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
      - frontend/public/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

version: '3.9'

services:
  # -------------------------------------------------------------------------
  # Redis — message broker + channel layer cache
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Django backend (ASGI via Daphne — handles HTTP + WebSocket)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml/artifacts:/app/../ml/artifacts
      - backend_media:/app/media
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  # -------------------------------------------------------------------------
  # Celery worker — executes async tasks
  # -------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - ./ml/artifacts:/app/../ml/artifacts
      - backend_media:/app/media
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A config.celery worker -l info -Q default,ml,reports,notifications --concurrency=4

  # -------------------------------------------------------------------------
  # Celery beat — periodic task scheduler
  # -------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # -------------------------------------------------------------------------
  # Next.js frontend
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000/ws
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: development

  # -------------------------------------------------------------------------
  # PocketBase — auxiliary non-clinical microservice (UI state & announcements)
  # -------------------------------------------------------------------------
  pocketbase:
    build:
      context: ./services/pocketbase
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # -------------------------------------------------------------------------
  # NocoDB — auxiliary healthcare analytics & data workspace engine
  # -------------------------------------------------------------------------
  nocodb:
    image: nocodb/nocodb:0.258.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NC_DB: "sqlite3:///usr/app/data/noco.db"
      NC_PUBLIC_URL: "http://localhost:8080"
      NC_DISABLE_TELEMETRY: "true"
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # Meilisearch — dedicated search indexing & fast retrieval layer (v1.12.0)
  # -------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-healthnova_meili_master_secret_key_32c}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 512Mb
      MEILI_MAX_INDEXING_THREADS: 2
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # -------------------------------------------------------------------------
  # Ollama — Self-Hosted / Local LLM Inference Layer (Prompt 38, v0.5.12)
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.12
    container_name: cdss_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_ORIGINS: ""
      OLLAMA_NUM_PARALLEL: 2
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama:/root/modelfiles:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 16384M
        reservations:
          memory: 2048M

  # -------------------------------------------------------------------------
  # Nginx reverse proxy
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  redis_data:
  backend_media:
  backend_logs:
  pocketbase_data:
  nocodb_data:
  meilisearch_data:
  ollama_data:

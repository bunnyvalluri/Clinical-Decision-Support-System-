[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
pythonpath = . ..
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --strict-markers
    --tb=short
    -q
    --disable-warnings
asyncio_mode = auto
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires DB, Redis)
    api: API endpoint tests (requires test client)
    slow: Slow tests (model training, large datasets)

[coverage:run]
source = apps, services, repositories
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__init__.py
    */apps.py
    */admin.py

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 70
